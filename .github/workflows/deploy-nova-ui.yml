name: Deploy Nova UI demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "nova-ui/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nova-ui

      - name: Build demo site
        run: npm run build:demo
        working-directory: nova-ui

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nova-ui/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
